[project]
name = "subscription_auditor"
version = "0.2.0"
description = "SubscriptionAuditor: a three-agent CrewAI crew, packaged for Amazon Bedrock AgentCore Runtime"
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[bedrock]>=1.15.22,<2.0.0",
    "bedrock-agentcore>=1.0.0",
    "boto3>=1.40.0",
    "pdfplumber>=0.11.0",
    "pymupdf>=1.24.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
subscription_auditor = "subscription_auditor.main:run"
run_crew = "subscription_auditor.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"